<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classwork5</title>
</head>
<body>
    <p id="demo1"></p> 
    <p id="demo2"></p>
    <p id="demo3"></p>
    <button onclick="checkReturn()">Check Return</button>
    
    <script>
    let order={
        itemName:"book",
        isDelivered:true,
        daysSinceDelivery:3 
              };
    
              function checkReturn(){
              let result=((order.isDelivered === true)&&(order.daysSinceDelivery<7))
              ? "Eligible for Return" : "Return Period Expired";

              document.getElementById("demo1").innerHTML=result;

              document.getElementById("demo2").innerHTML=("itemName" in order);

              delete order.daysSinceDelivery;

              //document.getElementById("demo3").innerHTML=JSON.stringify(order);

              


              }
   



    </script>
</body>
</html>
