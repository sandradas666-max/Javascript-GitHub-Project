<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homework10</title>
</head>
<body>
    <script>
        let jsonText='{"feedback":"Thank you for your service"}';

        try{

             let feedback=JSON.parse(jsonText);
             const checkFeedback=()=>{
                if(feedback.feedback.toLowerCase().includes("thank")){
                    console.log("positive feedback received");
                }
                else{
                    console.log("feedback noted");
                }
             };
             checkFeedback();
             }
             catch(error){
                console.log("invalid JSON");
             }
       
        

        
    </script>
</body>
</html>
