<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classwork7</title>
</head>
<body>

<body>

    <p id="result"></p>

    <button onclick="getBirthdayDetails(friend)">
        Show Birthday Details
    </button>

    <script>

        //Create friend object
        let friend = {
            name: "John",
            birthDate: "1999-07-05"
        };


        //Create function
        function getBirthdayDetails(friend) {

            //Convert birthDate string into Date object
            let birthDate = new Date(friend.birthDate);


            //Get birth year
            let year = birthDate.getFullYear();


            // Get month
            let monthNumber = birthDate.getMonth();

            let months = [
                "January", "February", "March",
                "April", "May", "June",
                "July", "August", "September",
                "October", "November", "December"
            ];

            let month = months[monthNumber];


            //Get day of the month
            let day = birthDate.getDate();


            //Calculate age
            let today = new Date();

            let currentYear = today.getFullYear();

            let age = currentYear - year;


            // Display result
            document.getElementById("result").innerHTML =
                friend.name + " was born on " +
                day + " " + month + ", " + year +
                " and is " + age + " years old.";
        }

    </script>

</body>
</html>
