<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classwork8</title>
</head>
<body>
   
    <script>
        let count=0;
        
        while (count<5){

            let code=Number(prompt("enter product code(1-3)"));
            let quantity=Number(prompt("enter quantity"));

            let product;
            let price;
            let message;

            switch(code){
                case 1:
                    product="Apple";
                    price=50;
                    break;

                case 2:
                    product="Banana";
                    price=20;
                    break;

                case 3:
                    product="orange";
                    price=40;
                    break;

                    default:
                        console.log("invalid product code");
                        count--;
                        

            }

            let total=price * quantity;

            if(total>100){
                message="high purshase";

            }
            else{
                message="normal purshase";

            }

            console.log("product:" + product);
            console.log("quantity" + quantity);
            console.log("total price:" +total);
            console.log(message);
            console.log("-----------------");

            count++;


        }
    </script>
</body>
</html>
