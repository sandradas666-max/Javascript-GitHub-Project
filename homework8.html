<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homework8</title>
</head>
<body>
    <script>
        let guessed=false;
        
       for(i=1;i<=5;i++){
        
        let num=Number(prompt("Enter a number between 1 and 5"));

        if(num < 1 || num > 5){
            console.log("invalid input");
            continue;

        }
        
        switch(num){
            case 1:
                console.log("one");
                break;

            case 2:
                console.log("two");
                break;

            case 3:
                console.log("three");
            break;
            case 4:
                console.log("four");
                break;

            case 5:
                console.log("five");
                break;
            }

            if(num === 3){
            console.log("you guessed it right");
            guessed=true;
            break;

        }
        else{
            console.log("wrong guess,try again");
        }

       }

       if(guessed===false){
        console.log("Game over.");
       }
    </script>
</body>
</html>
